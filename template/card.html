<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 띠운세 카드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">

<script src="../template/mascot.js"></script>
<style>
  /* 나눔스퀘어라운드(OFL)는 저장소에 넣어 둠 — 외부 글꼴 서버가 막혀도 발행이 멈추지 않게 */
  @font-face{font-family:NanumSquareRound;font-weight:300;font-display:block;src:url(../assets/fonts/NanumSquareRoundL.woff2) format("woff2")}
  @font-face{font-family:NanumSquareRound;font-weight:400;font-display:block;src:url(../assets/fonts/NanumSquareRoundR.woff2) format("woff2")}
  @font-face{font-family:NanumSquareRound;font-weight:700;font-display:block;src:url(../assets/fonts/NanumSquareRoundB.woff2) format("woff2")}
  @font-face{font-family:NanumSquareRound;font-weight:800;font-display:block;src:url(../assets/fonts/NanumSquareRoundEB.woff2) format("woff2")}
  /* 한지 크림 바탕 + 먹색 글자 + 띠마다 다른 포인트 색. 1080x1350(4:5), 치수는 cqw(카드 너비 1%). */
  :root{
    --paper:#f5eee1; --paper2:#ece2cf; --ink:#2a2320; --dim:#7a6e63; --line:#dccfb8;
    --night:#231d1a; --night2:#342b26; --gold:#e9c46a;
    --f:"NanumSquareRound","Noto Sans CJK KR","Noto Sans KR",system-ui,sans-serif;
    --card-w:100%; color-scheme:light;
  }
  *{box-sizing:border-box}
  body{background:#e4e0da;margin:0;font-family:var(--f);color:var(--ink)}
  .deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:20px;max-width:1180px;margin:0 auto;padding:24px 16px}
  html.render body{background:#fff} html.render .deck{display:block;padding:0;max-width:none}
  .card{width:var(--card-w);aspect-ratio:4/5;container-type:inline-size;position:relative;overflow:hidden;background:var(--paper);
    word-break:keep-all;overflow-wrap:break-word;box-shadow:0 8px 26px rgba(0,0,0,.12)}
  html.render .card{box-shadow:none}
  .in{position:absolute;inset:0;display:flex;flex-direction:column;padding:6.4cqw 6.4cqw 5.6cqw}
  .card::before{content:"";position:absolute;inset:2.4cqw;border:.3cqw solid var(--line);border-radius:2cqw;pointer-events:none}
  .num{font-variant-numeric:tabular-nums}
  .foot .fh{color:var(--ink);font-weight:900}

  .top{display:flex;justify-content:space-between;align-items:center;font-size:3cqw;font-weight:800;color:var(--dim)}
  .top b{color:var(--ink);font-family:Jua,var(--f);font-weight:400;font-size:4.2cqw;letter-spacing:0}
  .foot{margin-top:auto;display:flex;justify-content:space-between;gap:2cqw;font-size:2.55cqw;font-weight:700;color:var(--dim);padding-top:2cqw}

  .medal{flex:none;width:var(--s,16cqw);height:var(--s,16cqw);border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;
    font-size:calc(var(--s,16cqw)*.5);font-weight:900;font-family:"Noto Serif CJK KR","Noto Serif KR",serif;box-shadow:inset 0 0 0 .5cqw rgba(255,255,255,.25)}
  .stars{color:#e0a526;letter-spacing:.08em;white-space:nowrap}
  .stars i{font-style:normal;color:#d9cdb8}
  .word{display:inline-block;background:var(--c);color:#fff;font-weight:900;border-radius:5cqw;padding:.6cqw 2.4cqw;white-space:nowrap}

  /* 표지 */
  /* 표지: 크림 바탕 + 큰 질문형 제목 + 노란 상자 속 토끼 (원장님 시안 2026-11-10) */
  /* 매일 표지 (원장님 요청 2026-11-13): 요일마다 바탕색이 바뀌고 날짜를 아주 크게 — 피드에서 날짜 구분 */
  .cover{background:var(--day);--day:#ffd43b;--day2:#fff3bf}
  .cover::before{display:none}
  .cover .in{padding:5.6cqw 6.4cqw 5cqw}
  .cover .top{font-size:3.4cqw;color:#1a1416}
  .cover .top b{font-family:Jua,var(--f);font-weight:400;font-size:5cqw;letter-spacing:0;background:#fff;border:.45cqw solid #1a1416;border-radius:3cqw;padding:.3cqw 2.4cqw}
  .cover .top .dayn{font-weight:800;background:#1a1416;color:#fff;border-radius:3cqw;padding:.6cqw 2.2cqw}
  .cover .date{margin-top:2.2cqw;display:flex;align-items:flex-end;gap:2.6cqw}
  .cover .date .d{font-family:Jua,var(--f);font-size:28cqw;line-height:.86;white-space:nowrap;color:#fff;letter-spacing:-.02em;
    text-shadow:.7cqw .7cqw 0 #1a1416,-.7cqw .7cqw 0 #1a1416,.7cqw -.7cqw 0 #1a1416,-.7cqw -.7cqw 0 #1a1416,.9cqw 0 0 #1a1416,-.9cqw 0 0 #1a1416,0 .9cqw 0 #1a1416,0 -.9cqw 0 #1a1416,1.6cqw 1.8cqw 0 #1a1416}
  .cover .date .d .pt{display:inline-block;width:4.6cqw;height:4.6cqw;margin:0 1cqw;border-radius:50%;background:#fff;vertical-align:.4cqw;box-shadow:0 0 0 .8cqw #1a1416,1.4cqw 1.6cqw 0 .8cqw #1a1416}
  .cover .date .w{margin-bottom:2.4cqw;font-family:Jua,var(--f);font-size:7cqw;line-height:1;background:#1a1416;color:var(--day2);border-radius:2cqw;padding:1.4cqw 2.4cqw}
  .cover .kick{margin-top:3.6cqw;align-self:flex-start;font-size:4cqw;font-weight:800;color:#1a1416;background:#fff;border:.45cqw solid #1a1416;border-radius:2cqw;padding:.8cqw 2.6cqw}
  .cover h1{font-size:8.6cqw;font-weight:800;line-height:1.18;letter-spacing:-.05em;margin:2.6cqw 0 0;white-space:pre-line;color:#141210}
  .cover .sub{font-size:3.4cqw;color:#2b2520;font-weight:700;margin-top:1.6cqw;margin-bottom:1.6cqw}
  .cover .box{margin-top:auto;position:relative;background:#fff;border:.5cqw solid #1f1b18;border-radius:2cqw;min-height:20cqw;display:flex;align-items:center;justify-content:flex-end;padding:2.4cqw 4.2cqw;box-shadow:1.2cqw 1.2cqw 0 #1a1416}
  .cover .box .bn{position:absolute;left:1.6cqw;bottom:-.5cqw;width:21cqw;height:21cqw}
  .cover .box .bn svg{width:100%;height:100%}
  .cover .box .bt{font-family:Jua,var(--f);font-size:6.2cqw;line-height:1.25;text-align:right;white-space:pre-line;color:#1f1b18}
  .cover .go{margin-top:3.4cqw;text-align:center;font-size:4.2cqw;font-weight:800}
  .cover .go b{color:#1a1416}
  .cover .rule{margin-top:2cqw;border-top:.4cqw solid #1f1b18;padding-top:2.2cqw;text-align:center;font-size:3.4cqw;font-weight:700}
  .cover .wm,.story .wm{position:absolute;right:-6cqw;top:16cqw;font-size:62cqw;line-height:1;color:rgba(255,255,255,.035);font-family:"Noto Serif CJK KR",serif;font-weight:900;pointer-events:none}

  /* 띠 상세 */
  .tti .hd{display:flex;align-items:center;gap:4cqw;margin-top:2.6cqw}
  .tti .hd .nm{font-size:7.6cqw;font-weight:900;letter-spacing:-.05em;line-height:1}
  .tti .hd .nm small{font-size:3.4cqw;color:var(--dim);letter-spacing:0;margin-left:1cqw}
  .tti .hd .meta{display:flex;align-items:center;gap:2.4cqw;margin-top:1.8cqw;font-size:4.2cqw}
  .tti .hd .meta .word{font-size:3cqw}
  .tti .total{margin-top:3.4cqw;background:#fff8ec;border-left:1.2cqw solid var(--c);border-radius:1.6cqw;padding:2.4cqw 3.6cqw;font-size:4.1cqw;font-weight:800;line-height:1.4;text-wrap:balance}
  .tti .total .tl{font-size:5cqw;font-weight:900;line-height:1.35;text-wrap:balance}
  .tti .total .sm{margin-top:1cqw;font-size:3.2cqw;font-weight:700;color:#4d4239;line-height:1.5;text-wrap:pretty}
  .tti .total::before{content:"오늘의 한 줄";display:block;font-size:2.5cqw;font-weight:900;color:var(--c);margin-bottom:.6cqw}
  .tti .todo{margin-top:2.6cqw;display:flex;align-items:center;gap:2.4cqw;font-size:4.2cqw;font-weight:900;background:#fdf1c4;border-radius:2cqw;padding:2.2cqw 3cqw}
  .tti .todo span{flex:none;background:#f9d65c;border:.3cqw solid #1f1b18;border-radius:1.2cqw;padding:.4cqw 1.8cqw;font-size:3cqw}
  .tti .yrs{margin-top:2.4cqw;display:flex;flex-direction:column}
  .tti .yr{display:flex;align-items:center;gap:3.2cqw;padding:2.2cqw 0;border-bottom:.25cqw dashed var(--line)}
  .tti .yr:last-child{border-bottom:0}
  .tti .yr .y{flex:none;width:14.5cqw;font-size:3.7cqw;font-weight:900;color:var(--c);line-height:1.35}
  .tti .yr .y small{display:block;font-size:2.6cqw;color:var(--dim);font-weight:700}
  .tti .yr .x{font-size:3.85cqw;font-weight:700;line-height:1.45}
  .tti .lk{margin-top:auto;display:grid;grid-template-columns:1.15fr 1.25fr .9fr .9fr;gap:1.4cqw}
  .tti .lk > div{background:var(--paper2);border-radius:2cqw;padding:2cqw 2.2cqw;display:flex;align-items:center;gap:1.6cqw;min-width:0}
  .tti .lk > div > span:last-child{min-width:0}
  .tti .lk .k{font-size:2.4cqw;font-weight:800;color:var(--dim)}
  .tti .lk .v{margin-top:.6cqw;font-size:3.5cqw;font-weight:900;line-height:1.2;word-break:keep-all}
  .sw{flex:none;width:5cqw;height:5cqw;border-radius:50%;background:var(--sw);box-shadow:inset 0 0 0 .3cqw rgba(0,0,0,.15)}
  .squeeze.tti .yr .x{font-size:3.5cqw} .squeeze.tti .total .tl{font-size:4.5cqw}
  .squeeze.tti .yr{padding:1.4cqw 0}

  /* 순위 */
  .h2{font-size:6.4cqw;font-weight:900;letter-spacing:-.045em;margin-top:3.4cqw}
  .rank .list{margin-top:2.6cqw;display:flex;flex-direction:column;gap:1.4cqw}
  .rank .r{display:flex;align-items:center;gap:3cqw;background:#fffaf1;border-radius:2.4cqw;padding:1.5cqw 3cqw}
  .rank .r .no{width:7cqw;font-size:5.4cqw;font-weight:900;color:var(--dim);text-align:center}
  .rank .r.best .no{color:#c0392b}
  .rank .r .medal{--s:9.2cqw}
  .rank .r .mid{flex:1;min-width:0}
  .rank .r .n{font-size:4.6cqw;font-weight:900;color:var(--ink)}
  .rank .r .tx{font-size:2.95cqw;font-weight:700;color:var(--dim);margin-top:.5cqw;line-height:1.3}
  .rank .r .sc{text-align:right;font-size:3.4cqw;display:flex;align-items:center;gap:2cqw}
  .rank .r .sc .word{font-size:2.7cqw}

  /* 행운표 */
  .lucky .grid{margin-top:2.6cqw;display:grid;grid-template-columns:1fr 1fr;gap:1.3cqw}
  .lucky .g{display:flex;align-items:center;gap:2.2cqw;background:#fffaf1;border-radius:2cqw;padding:1.4cqw 2.4cqw;min-width:0}
  .lucky .g .medal{--s:8.4cqw}
  .lucky .g .n{font-size:3.4cqw;font-weight:900}
  .lucky .g .it b{color:var(--ink);font-weight:900}
  .lucky .g .it{font-size:3cqw;font-weight:700;color:var(--dim);margin-top:.3cqw;line-height:1.3}
  .lucky .g .sw{width:5cqw;height:5cqw;margin-left:auto}
  .lucky .g .mid{min-width:0}

  /* 마무리: 가는 글씨 + 굵은 강조, 큰 따옴표, 기울어진 번호 배지 + 노란 막대 (원장님 참고 시안) */
  .outro{background:#fbf7ee}
  .outro::before{display:none}
  .outro .in{padding:6.4cqw 7.2cqw 5.4cqw}
  .outro .top{font-size:3.6cqw;color:var(--ink)} .outro .top b{font-size:5.4cqw}
  .outro .q{margin-top:1.6cqw;font-family:Georgia,serif;font-size:18cqw;line-height:.7;height:9cqw;color:#f2c230;font-weight:700}
  .outro .note{font-size:6.2cqw;font-weight:300;line-height:1.45;color:#57504a;letter-spacing:-.03em;text-wrap:balance}
  .outro .note b{font-weight:800;color:#141210}
  .outro .ttl{margin-top:4cqw;font-size:5.2cqw;font-weight:300;line-height:1.35;color:#3a3430}
  .outro .ttl b{font-size:6.8cqw;font-weight:800;color:#141210}
  .outro .steps{margin-top:3cqw;display:flex;flex-direction:column;gap:2cqw}
  .outro .st{display:flex;align-items:center}
  .outro .st .no{flex:none;position:relative;z-index:1;width:9.4cqw;height:9.4cqw;display:grid;place-items:center;background:#fff;border-radius:2cqw;
    box-shadow:0 .6cqw 1.6cqw rgba(0,0,0,.18);transform:rotate(-8deg);font-size:5.8cqw;font-weight:800;font-style:italic;color:#141210;margin-right:-2.4cqw}
  .outro .st .bar{flex:1;background:#f9d65c;border-radius:1.6cqw;padding:2cqw 3cqw 2cqw 5cqw;font-size:3.7cqw;font-weight:400;color:#1f1b18}
  .outro .st .bar b{font-weight:800;margin-right:1cqw}
  .outro .share{margin-top:auto;font-size:3.4cqw;font-weight:400;color:var(--dim);line-height:1.5;text-align:center}
  .outro .share b{font-weight:800;color:var(--ink)}
  .outro .rule{margin-top:2.4cqw;border-top:.4cqw solid #1f1b18;padding-top:2.6cqw;text-align:center;font-size:3.7cqw;font-weight:400}
  .outro .rule b{font-weight:800}
  /* 주간 띠별 운세 한 장 (원장님 참고 시안 2026-11-10: 연분홍 바탕, 2열 x 6줄, 띠 동그라미 + 년생별 한 줄) */
  .weekly{background:#fbeae6}
  .weekly::before{display:none}
  .weekly .in{padding:4.6cqw 4.4cqw 3.6cqw}
  .weekly .hd{display:flex;align-items:center;justify-content:center;gap:2.4cqw}
  .weekly .hd .bn{width:13cqw;height:13cqw;flex:none}
  .weekly .hd .bn svg{width:100%;height:100%}
  .weekly .hd .k{font-family:Jua,var(--f);font-size:3.4cqw;color:#a2665a}
  .weekly .hd .t{font-family:Jua,var(--f);font-size:7.4cqw;line-height:1.05;color:#5a3a32}
  .weekly .grid{margin-top:2.4cqw;flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(6,1fr);column-gap:2cqw;row-gap:1.2cqw;
    background:#fffaf6;border-radius:3cqw;padding:2.6cqw 2.2cqw;box-shadow:0 .4cqw 1.6cqw rgba(160,100,90,.12)}
  .weekly .cell{display:flex;align-items:center;gap:1.4cqw;min-width:0}
  .weekly .cell .md{flex:none;width:8.6cqw;text-align:center}
  .weekly .cell .medal{--s:7.8cqw;margin:0 auto;font-size:3.9cqw}
  .weekly .cell .nm{display:inline-block;margin-top:-1.4cqw;position:relative;background:#fff;border:.3cqw solid #e2c6bd;border-radius:3cqw;padding:0 1cqw;font-size:2.2cqw;white-space:nowrap;font-weight:800;color:#5a3a32}
  .weekly .cell .ln{min-width:0;display:flex;flex-direction:column;gap:.5cqw}
  .weekly .cell .l{font-size:2.6cqw;font-weight:700;color:#4a3a34;line-height:1.3;padding-left:6.4cqw;text-indent:-6.4cqw}
  .weekly .cell .l b{font-weight:800;color:#c0625a;margin-right:.8cqw}
  .weekly .ft{margin-top:1.8cqw;display:flex;justify-content:space-between;font-size:2.6cqw;font-weight:700;color:#a2665a}
  .weekly .ft b{color:#5a3a32;font-weight:800}
  /* 이달의 띠운세 한 장 (원장님 참고 시안 2026-11-10: 4열 x 3줄, 말풍선 + 연애·금전·직장·전체 + 한 줄 조언) */
  .monthly{background:#f7efe0}
  .monthly::before{display:none}
  .monthly .in{padding:3.6cqw 3.4cqw 3cqw}
  .monthly .hd{display:flex;align-items:center;gap:2.6cqw;background:#fffaf0;border:.35cqw solid #e5d3b3;border-radius:2.4cqw;padding:1.6cqw 3cqw}
  .monthly .hd .bn{width:9cqw;height:9cqw;flex:none} .monthly .hd .bn svg{width:100%;height:100%}
  .monthly .hd .t{font-family:Jua,var(--f);font-size:7cqw;line-height:1;color:#3a2a20} .monthly .hd .t em{font-style:normal;color:#2f6fd6}
  .monthly .hd .s{margin-top:1cqw;font-size:2.7cqw;font-weight:700;color:#6a5646;line-height:1.35}
  .monthly .hd .lg{margin-left:auto;flex:none;display:grid;grid-template-columns:auto auto;gap:.5cqw 1.6cqw;font-size:2.3cqw;font-weight:800;color:#4a3a30}
  .monthly .hd .lg i,.monthly .rt i{font-style:normal;display:inline-block;width:1.8cqw;height:1.8cqw;border-radius:50%;margin-right:.8cqw;vertical-align:-.1cqw}
  .monthly .c-love{background:#e8707e} .monthly .c-money{background:#e0a526} .monthly .c-work{background:#4f7fd6} .monthly .c-all{background:#4caa6a}
  .monthly .grid{margin-top:1.6cqw;flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,minmax(0,1fr));gap:1.2cqw}
  .monthly .cell{background:#fffaf2;border:.3cqw solid #ead9bd;border-radius:2cqw;padding:1.3cqw 1.4cqw 1.2cqw;display:flex;flex-direction:column;min-width:0}
  .monthly .cell .nm{font-size:3.2cqw;font-weight:800;color:#3a2a20;white-space:nowrap}
  .monthly .cell .bub{position:relative;margin-top:.8cqw;background:#fff;border:.3cqw solid #d9c7a8;border-radius:1.8cqw;padding:.7cqw 1cqw;font-size:2.15cqw;font-weight:800;line-height:1.3;color:#3a2a20;text-align:center;min-height:5.6cqw;display:grid;place-items:center}
  .monthly .cell .mid{margin-top:1cqw}
  .monthly .cell .nm .medal{--s:4.8cqw;font-size:2.5cqw;display:inline-grid;vertical-align:-1cqw;margin-right:1cqw}
  .monthly .rt{display:grid;grid-template-columns:1fr 1fr;gap:.6cqw 1cqw;font-size:2.4cqw;font-weight:700;color:#4a3a30;min-width:0}
  .monthly .rt span{white-space:nowrap} .monthly .rt b{font-weight:800} .monthly .rt b.best{color:#c0392b}
  .monthly .cell .adv{margin-top:auto;padding-top:1cqw;border-top:.25cqw dashed #e0cfb2;font-size:2.3cqw;font-weight:800;color:#5a4636;text-align:center;line-height:1.3}
  .monthly .ft{margin-top:1.6cqw;background:#fdf1c4;border:.35cqw solid #e5cf8a;border-radius:2cqw;padding:1.2cqw 2.4cqw;text-align:center;font-size:3.3cqw;font-weight:800;color:#3a2a20}
  .monthly .ft small{display:block;margin-top:.6cqw;font-size:2.3cqw;font-weight:700;color:#8a7360}
  /* 주말 한마디 (원장님 참고 시안 2026-11-10): 큰 두 줄 제목 + 12띠 순위 한 줄씩 */
  .weekend{background:linear-gradient(180deg,#dfe8ef,#eef3f6)}
  .weekend::before{display:none}
  .weekend .in{padding:5cqw 5.4cqw 4cqw}

  /* 상반기·하반기 띠별 운세 (원장님 참고 시안 2026-11-10): 한 장에 두 띠, 흐름 + 주의할 시기 */
  .half{background:#fbe3e3}

  .half .ft b{color:#3a2a2a;font-weight:800}
  /* 특집 표지 (원장님 참고 시안 2026-11-10): 밤하늘·달·12띠 캐릭터 + 손글씨 한 줄 + 흰 테두리 보라 그라데이션 큰 제목 */
  .hcover{background:linear-gradient(180deg,#ffe9f2 0%,#ffd6e8 100%)}

  .hcover .moon::after{content:"";position:absolute;left:14cqw;top:-4cqw;width:52cqw;height:52cqw;border-radius:50%;background:#1b2347}
  .hcover .star{position:absolute;color:#f6d77a;font-size:3cqw}
  .hcover .art{position:absolute;left:0;right:0;bottom:0;height:78%;display:flex;align-items:flex-end;justify-content:center}

  .hcover .big{font-family:Jua,var(--f);font-size:12cqw;line-height:1.12;text-align:center;color:#fff;letter-spacing:-.01em;
    filter:drop-shadow(0 .8cqw 0 #00000055)}
  .hcover .big span{display:block}

    text-shadow:none;filter:drop-shadow(.5cqw 0 0 #fff) drop-shadow(-.5cqw 0 0 #fff) drop-shadow(0 .5cqw 0 #fff) drop-shadow(0 -.5cqw 0 #fff)}
  .hcover .big .k{color:#fff;text-shadow:0 0 0 #000,.45cqw .45cqw 0 #1b1530,-.45cqw .45cqw 0 #1b1530,.45cqw -.45cqw 0 #1b1530,-.45cqw -.45cqw 0 #1b1530,.6cqw 0 0 #1b1530,-.6cqw 0 0 #1b1530,0 .6cqw 0 #1b1530,0 -.6cqw 0 #1b1530;filter:drop-shadow(.5cqw 0 0 #fff) drop-shadow(-.5cqw 0 0 #fff) drop-shadow(0 .5cqw 0 #fff) drop-shadow(0 -.5cqw 0 #fff)}
  .hcover .sky.full{background:linear-gradient(180deg,#fee802,#feb3b9)}
  .hcover .sky.full img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center center}
  .hcover .tag{position:absolute;right:3cqw;top:2.6cqw;font-family:Jua,var(--f);font-size:4.4cqw;color:#1a1416;background:#fff;border:.4cqw solid #1a1416;border-radius:3cqw;padding:.4cqw 2.2cqw}
  /* 테마 특집 (원장님 참고 시안 2026-11-10): 물방울/집중선 배경 + '친구 소환' 손글씨 + 광택 테두리 큰 제목, 안쪽은 띠별 좋은 달 */
  .tcover,.tlist{--a1:#ff7ab8;--a2:#e0217a;--lt:#ffd1e6}
  .tc-blue{--a1:#7fd0ff;--a2:#1e8be0;--lt:#cdeeff}
  .tc-orange{--a1:#ffb15c;--a2:#ef6a12;--lt:#ffe3c4}
  .tcover::before,.tlist::before{display:none}
  .tcover.dots,.tlist.dots{background:radial-gradient(circle,#ffffff 0 0) ,#eceaf0;
    background-image:radial-gradient(circle at center,rgba(255,140,190,.35) 0 1.1cqw,transparent 1.2cqw),radial-gradient(circle at center,rgba(140,200,140,.35) 0 1.1cqw,transparent 1.2cqw);
    background-size:12cqw 12cqw,12cqw 12cqw;background-position:0 0,6cqw 6cqw;background-color:#efedf2}
  .tcover.burst,.tlist.burst{background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.16) 0 .6deg,transparent .6deg 6deg),radial-gradient(circle at 50% 50%,#3a2f86 0,#22195c 55%,#150f3e 100%)}
  .tcover .in{align-items:center;justify-content:center;gap:2.4cqw;padding:6cqw 4cqw}
  .tcover .hand{font-family:Jua,var(--f);font-size:4.4cqw;color:#1f1b18;background:linear-gradient(transparent 55%,var(--lt) 55%,var(--lt) 92%,transparent 92%);padding:0 2cqw}
  .tcover.burst .hand{color:#fff;background:linear-gradient(transparent 55%,var(--a2) 55%,var(--a2) 92%,transparent 92%)}
  .gl{font-family:Jua,var(--f);font-size:15.5cqw;line-height:1.08;text-align:center;letter-spacing:-.01em}
  .gl span{display:block;position:relative}
  .gl .c{background:linear-gradient(180deg,var(--a1) 0%,var(--a2) 60%,var(--a2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    -webkit-text-stroke:.5cqw #1a1416;filter:drop-shadow(.7cqw 0 0 #fff) drop-shadow(-.7cqw 0 0 #fff) drop-shadow(0 .7cqw 0 #fff) drop-shadow(0 -.7cqw 0 #fff) drop-shadow(0 1cqw 0 rgba(0,0,0,.25))}
  .gl .w{color:#fff;text-shadow:0 0 0 #000,.45cqw .45cqw 0 #1a1416,-.45cqw .45cqw 0 #1a1416,.45cqw -.45cqw 0 #1a1416,-.45cqw -.45cqw 0 #1a1416,.6cqw 0 0 #1a1416,-.6cqw 0 0 #1a1416,0 .6cqw 0 #1a1416,0 -.6cqw 0 #1a1416;filter:drop-shadow(.7cqw 0 0 #fff) drop-shadow(-.7cqw 0 0 #fff) drop-shadow(0 .7cqw 0 #fff) drop-shadow(0 -.7cqw 0 #fff) drop-shadow(0 1cqw 0 rgba(0,0,0,.25))}
  .gl .u{display:inline-block;background:linear-gradient(transparent 62%,var(--a2) 62%,var(--a2) 96%,transparent 96%);border-radius:1cqw;padding:0 2cqw}
  .tcover .tag{position:absolute;right:4cqw;bottom:3.6cqw;font-family:Jua,var(--f);font-size:3.6cqw;color:#1f1b18;opacity:.75}
  .tcover.burst .tag{color:#fff}
  .tlist .in{padding:5cqw 5cqw 4cqw}
  .tlist .h{font-family:Jua,var(--f);font-size:6.6cqw;color:#1f1b18;text-align:center}
  .tlist.burst .h{color:#fff}
  .tlist .rows{margin-top:3cqw;flex:1;display:flex;flex-direction:column;gap:1.8cqw}
  .tlist .r{flex:1;display:flex;align-items:center;gap:2.6cqw;background:#fffdfb;border:.45cqw solid #1a1416;border-radius:2.4cqw;padding:1.6cqw 2.6cqw;box-shadow:0 .7cqw 0 var(--a2)}
  .tlist .r .medal{--s:10cqw;font-size:5cqw}
  .tlist .r .nm{font-size:4.2cqw;font-weight:800;color:#1f1b18} .tlist .r .nm small{display:block;font-size:2.6cqw;color:#7a6e63;font-weight:700}
  .tlist .r .mo{flex:none;margin-left:auto;text-align:right}
  .tlist .r .mo b{display:inline-block;font-family:Jua,var(--f);font-size:5.2cqw;color:var(--a2)}
  .tlist .r .mo span{display:block;font-size:2.8cqw;font-weight:700;color:#3a3430;max-width:44cqw}
  .tlist .ft{margin-top:2.4cqw;display:flex;justify-content:space-between;font-size:2.8cqw;font-weight:700;color:#55505a}
  .tlist.burst .ft{color:#cfc8f0} .tlist .ft b{font-weight:800}
  /* 스토리 9:16 */
  .story{aspect-ratio:9/16;background:var(--night);color:#f5eee1}
  .story::before{border-color:#4a3e36}
  .story .top,.story .foot{color:#bfae9c} .story .top b{color:var(--gold)} .story .foot .fh{color:var(--gold)}
  .story .in{padding:14cqw 7cqw 12cqw}
  .story .clockbig{margin-top:14cqw;font-size:30cqw;font-weight:900;letter-spacing:-.05em;line-height:1;color:var(--gold)}
  .story .sk{margin-top:3cqw;font-size:5.4cqw;font-weight:900}

  .story .nx span{display:block;font-size:3.4cqw;color:var(--gold);margin-bottom:1cqw}
  .story .foot{font-size:3.2cqw;padding-top:4cqw}

</style>

<body>
<div class="deck" id="deck"></div>
<script id="data" type="application/json">/*DATA*/</script>
<script>
(() => {
  let data;
  try { data = JSON.parse(document.getElementById("data").textContent); } catch { return; }
  const H = data.head;
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const st = (n) => "★".repeat(n) + `<i>${"★".repeat(5 - n)}</i>`;
  const medal = (t, s) => `<div class="medal" style="--c:${t.color}${s ? `;--s:${s}` : ""}">${t.hanja}</div>`;
  const top = (dark) => `<div class="top"><b>띠운세</b><span class="num">${H.md} ${H.wd}</span></div>`;
  const foot = (i, n) => `<div class="foot"><span><b class="fh">${esc(H.handle)}</b> · 팔로우하고 매일 아침 6시 내 띠 운세 받기</span><span class="num">${i}/${n}</span></div>`;
  const n = data.cards.length;

  const html = data.cards.map((c, k) => {
    const i = k + 1;
    if (c.type === "cover") {
      // 요일별 바탕색 (월 주황 · 화 노랑 · 수 초록 · 목 하늘 · 금 보라 · 토 민트 · 일 분홍)
      const DAY = { 월: ["#ffa94d", "#fff4e6"], 화: ["#ffd43b", "#fff9db"], 수: ["#8ce99a", "#ebfbee"], 목: ["#74c0fc", "#e7f5ff"], 금: ["#b197fc", "#f3f0ff"], 토: ["#63e6be", "#e6fcf5"], 일: ["#faa2c1", "#fff0f6"] }[H.wd] || ["#ffd43b", "#fff9db"];
      return `<section class="card cover" style="--day:${DAY[0]};--day2:${DAY[1]}"><div class="in"><div class="top"><b>띠운세</b><span class="dayn">${H.dayN}일째</span></div>
        <div class="date"><span class="d num">${H.md.split(".")[0]}<i class="pt"></i>${H.md.split(".")[1]}</span><span class="w">${H.wd}요일</span></div>
        <div class="kick">${esc(c.kicker)}</div>
        <h1>${esc(c.title)}</h1><div class="sub">${esc(c.sub)}</div>
        <div class="box"><div class="bn">${window.bunny ? bunny("list") : ""}</div><div class="bt">${esc(c.box)}</div></div>
        <div class="go">${esc(c.go)} <b>→</b></div>
        <div class="rule">${esc(c.follow)}</div></div></section>`;
    }
    if (c.type === "tti") {
      const t = c.tti, L = t.lucky;
      return `<section class="card tti" style="--c:${t.color}"><div class="in">${top()}
        <div class="hd">${medal(t, "12cqw")}<div><div class="nm">${t.key}띠 <small class="num">${t.years.map((y) => String(y.year).slice(2)).join("·")}년생</small></div>
          <div class="meta"><span class="stars">${st(t.stars)}</span><span class="word">${esc(t.word)}</span></div></div></div>
        <div class="total"><div class="tl">${esc(t.core)}</div></div>
        <div class="yrs">${[["일·공부", t.work], ["금전", t.money], ["관계", t.relation]].map(([k, x]) => `<div class="yr"><div class="y">${k}</div><div class="x">${esc(x)}</div></div>`).join("")}</div>
        <div class="todo"><span>오늘의 행동</span>${esc(t.action)}</div>
        <div class="lk">
          <div><span class="sw" style="--sw:${L.color.hex}"></span><span><div class="k">행운의 색</div><div class="v">${esc(L.color.name)}</div></span></div>
          <div><span><div class="k">행운의 물건</div><div class="v">${esc(L.item)}</div></span></div>
          <div><span><div class="k">숫자</div><div class="v num">${L.numbers.join(" · ")}</div></span></div>
          <div><span><div class="k">방향</div><div class="v">${esc(L.direction)}</div></span></div>
        </div>${foot(i, n)}</div></section>`;
    }
    if (c.type === "rank") {
      return `<section class="card rank"><div class="in">${top()}<div class="h2">${esc(c.title)}</div>
        <div class="list">${c.list.map((t) => `<div class="r${t.rank <= 3 ? " best" : ""}"><div class="no num">${t.rank}</div>${medal(t)}
          <div class="mid"><div class="n">${t.key}띠</div><div class="tx num">${t.years.map((y) => String(y.year).slice(2)).join(" · ")}년생</div></div>
          <div class="sc"><div class="stars">${st(t.stars)}</div><span class="word" style="--c:${t.color}">${esc(t.word)}</span></div></div>`).join("")}</div>${foot(i, n)}</div></section>`;
    }
    if (c.type === "lucky") {
      return `<section class="card lucky"><div class="in">${top()}<div class="h2">${esc(c.title)}</div>
        <div class="grid">${c.list.map((t) => `<div class="g">${medal(t)}<div class="mid"><div class="n">${t.key}띠</div><div class="it"><b>${esc(t.lucky.color.name)}</b> · ${esc(t.lucky.item)}</div></div><span class="sw" style="--sw:${t.lucky.color.hex}"></span></div>`).join("")}</div>${foot(i, n)}</div></section>`;
    }
    if (c.type === "weekly") {
      return `<section class="card weekly"><div class="in">
        <div class="hd"><div class="bn">${window.bunny ? bunny("face") : ""}</div><div><div class="k">띠운세 토끼가 알려주는</div><div class="t">${esc(c.range)} 띠별 주간 운세</div></div></div>
        <div class="grid">${c.rows.map((t) => `<div class="cell"><div class="md">${medal(t)}<span class="nm">${t.key}띠</span></div>
          <div class="ln">${t.years.map((y) => `<div class="l"><b class="num">${String(y.year).slice(2)}년생</b>${esc(y.text)}</div>`).join("")}</div></div>`).join("")}</div>
        <div class="ft"><span><b>${esc(H.handle)}</b> · 매일 아침 6시 띠별 운세</span><span>저장해 두고 한 주 동안 꺼내 보세요</span></div></div></section>`;
    }
    if (c.type === "monthly") {
      const R = [["love", "연애"], ["money", "금전"], ["work", "직장"], ["all", "전체"]];
      return `<section class="card monthly"><div class="in">
        <div class="hd"><div class="bn">${window.bunny ? bunny("face") : ""}</div><div><div class="t">${esc(c.month)} <em>띠운세</em></div><div class="s">${esc(c.summary)}</div></div>
          <div class="lg">${R.map(([k, n]) => `<span><i class="c-${k}"></i>${n}운</span>`).join("")}</div></div>
        <div class="grid">${c.rows.map((t) => `<div class="cell"><div class="nm">${medal(t)}${t.key}띠</div><div class="bub">${esc(t.bubble)}</div>
          <div class="mid"><div class="rt">${R.map(([k, n]) => `<span><i class="c-${k}"></i><b class="${t[k] === "최고" ? "best" : ""}">${esc(t[k])}</b></span>`).join("")}</div></div>
          <div class="adv">${esc(t.advice)}</div></div>`).join("")}</div>
        <div class="ft">행운 한 줄 요약 · ${esc(c.oneline)}<small>${esc(H.handle)} · 매일 아침 6시 띠별 운세 · 일요일 밤 8시 주간 운세</small></div></div></section>`;
    }
    if (c.type === "weekend") {
      return `<section class="card weekend"><div class="in">
        <div class="t1">${esc(c.t1)}</div><div class="t2">${esc(c.t2)}</div>
        <div class="list">${c.list.map((t) => `<div class="r">${medal(t)}<span class="nm">${t.key}띠</span><span class="yr num">${t.years.map((y) => String(y.year).slice(2)).join("·")}년생</span><span class="tx">${esc(t.line)}</span></div>`).join("")}</div>
        <div class="ft"><span><b>${esc(H.handle)}</b> · 주말 한마디</span><span>${i}/${n}</span></div></div></section>`;
    }
    if (c.type === "half") {
      return `<section class="card half"><div class="in"><div class="ttl"><span>#</span>${esc(c.label)} 띠별 운세</div>
        <div class="two">${c.pair.map((t) => `<div class="bx"><div class="nm">${medal(t)}${t.key}띠 <small class="num">(${t.years.map((y) => String(y.year).slice(2)).join(", ")}년생)</small></div>
          <div class="fl">${esc(t.flow)}</div><div class="warn"><b>⚠ 주의해야 할 시기 (${esc(t.when)})</b>${esc(t.caution)}</div></div>`).join("")}</div>
        <div class="ft"><span><b>${esc(H.handle)}</b> · ${esc(c.label)} 띠별 운세</span><span>${i}/${n}</span></div></div></section>`;
    }
    if (c.type === "hcover") {
      const stars = [[8,10],[16,28],[86,14],[92,34],[70,6],[6,44],[60,30]].map(([x, y]) => `<span class="star" style="left:${x}cqw;top:${y}cqw">✦</span>`).join("");
      const art = c.art ? `<img src="${c.art}" alt="">` : `<div class="med">${c.rows.map((t) => medal(t)).join("")}</div>`;
      const sky = c.art ? `<div class="sky full"><img src="${c.art}" alt=""><div class="tag">띠운세</div></div>` : `<div class="sky"><div class="moon"></div>${stars}<div class="tag">띠운세</div><div class="art">${art}</div></div>`;
      return `<section class="card hcover"><div class="in">${sky}
        <div class="bot"><div class="hand">${esc(c.hand)}</div><div class="big"><span class="g">${esc(c.l1)}</span><span class="k">${esc(c.l2)}</span></div></div></div></section>`;
    }
    if (c.type === "tcover") {
      return `<section class="card tcover ${c.bg} tc-${c.color}"><div class="in"><div class="hand">${esc(c.hand)}</div>
        <div class="gl"><span class="c">${esc(c.l1)}</span><span class="w">${esc(c.l2)}</span><span><span class="c u">${esc(c.l3)}</span></span></div>
        <div class="tag">${esc(H.handle)}</div></div></section>`;
    }
    if (c.type === "tlist") {
      return `<section class="card tlist ${c.bg} tc-${c.color}"><div class="in"><div class="h">${esc(c.title)}</div>
        <div class="rows">${c.list.map((t) => `<div class="r">${medal(t)}<div class="nm">${t.key}띠<small class="num">${t.years.map((y) => String(y.year).slice(2)).join("·")}년생</small></div>
          <div class="mo"><b>${esc(t.months)}</b><span>${esc(t.line)}</span></div></div>`).join("")}</div>
        <div class="ft"><span><b>${esc(H.handle)}</b> · 테마 특집</span><span>${i}/${n}</span></div></div></section>`;
    }
    if (c.type === "story") {
      return `<section class="card story"><div class="wm">${c.tti.hanja}</div><div class="in">${top()}
        <div class="clockbig num">${c.clock}</div><div class="sk">${esc(c.kicker)}</div>
        <div class="hero">${medal(c.tti, "30cqw")}<h1>${esc(c.title)}</h1></div>
        <div class="sl">${esc(c.line)}</div>
        <div class="nx"><span>다음 도착</span>${esc(c.next)}</div>
        <div class="foot"><span><b class="fh">${esc(H.handle)}</b> · 매일 같은 시간, 내 띠 운세</span><span class="num">${H.dayN}일째</span></div></div></section>`;
    }
    // 마무리 (원장님 참고 시안 2026-11-10): 가는 글씨 + 핵심만 굵게, 큰 따옴표, 기울어진 번호 배지 + 색 막대 목록
    const em = (s) => esc(s || "").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>"); // **강조** → 굵게
    const steps = [["아침 6시", "띠별 일·돈·관계 운세와 오늘의 행동"], ["밤 9시", "내일 띠 순위를 하루 먼저"], ["매일", "바뀌는 행운의 색·물건·숫자"]];
    return `<section class="card outro"><div class="in"><div class="top"><b>띠운세</b><span>${H.long}</span></div>
      <div class="q">“</div>
      <div class="note">${em(c.cheer)}</div>
      <div class="ttl">띠운세를 팔로우하면<br><b>매일 받는 3가지</b></div>
      <div class="steps">${steps.map(([k, x], j) => `<div class="st"><span class="no">${j + 1}</span><div class="bar"><b>${esc(k)}</b> ${esc(x)}</div></div>`).join("")}</div>
      <div class="share">${em(c.share)}${c.teaser ? `<br>${esc(c.teaser)}` : ""}</div>
      <div class="rule"><b>${esc(H.handle)}</b> 팔로우하고 매일 받아 보세요</div></div></section>`;
  }).join("");
  document.getElementById("deck").innerHTML = html;
  document.fonts.ready.then(() => (document.documentElement.dataset.ready = "1"));
})();
</script>
</body>
</html>
